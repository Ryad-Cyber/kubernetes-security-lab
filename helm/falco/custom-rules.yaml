customRules:
  security-lab.yaml: |-
    - rule: Backend File Permission Change
      desc: Detect permission changes inside backend containers
      condition: >
        evt.type in (chmod, fchmod, fchmodat)
        and evt.dir=<
        and container
        and k8s.ns.name=backend
      output: >
        Backend file permission change
        (user=%user.name uid=%user.uid command=%proc.cmdline
        pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: WARNING
      tags: [filesystem, security_lab]
